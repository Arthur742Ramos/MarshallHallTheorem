    id: "10.4153/CJM-1949-017-2"
    type: "article"
    location: "https://doi.org/10.4153/CJM-1949-017-2"
    relationship: "formalizes"
    note: "Classical source for the finite-index extension theorem; the library proves the free-factor conclusion with an explicit inclusion-compatible coproduct witness and separately exposes the finite permutation separator yielding its LERF consequence."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Topology of finite graphs"
    authors:
      - "John R. Stallings"
    id: "10.1007/BF02095993"
    type: "article"
    location: "Inventiones Mathematicae 71(3), 551--565 (1983)"
    relationship: "background"
    note: "Original finite-graph and core-graph source for the covering perspective behind the finite-state completion used by the implementation."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Stallings foldings and subgroups of free groups"
    authors:
      - "Ilya Kapovich"
      - "Alexei Myasnikov"
    id: "10.1006/jabr.2001.9033"
    type: "article"
    location: "Journal of Algebra 248(2), 608--668 (2002)"
    relationship: "background"
    note: "Combinatorial and computational treatment of Stallings foldings; it motivates the finite-core viewpoint, while this repository proves the stated separator by finite permutation completion."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "On the Number of Generators of a Free Product"
    authors:
      - "B. H. Neumann"
    id: "10.1112/jlms/s1-18.1.12"
    type: "article"
    location: "Journal of the London Mathematical Society 18(1), 12--20 (1943)"
    relationship: "formalizes"
    note: "Classical source for the Grushko--Neumann rank-additivity theorem; this repository formalizes the finite-rank free-group cases and the arbitrary-factor binary theorem by a certified finite labelled-graph reduction."
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/v4.32.0/Mathlib/GroupTheory/FreeGroup/NielsenSchreier.lean"
    relationship: "builds-on"
    note: "Uses Mathlib's free-group representation and Nielsen--Schreier infrastructure; the finite-core separation construction is developed in this repository."
  - id: "https://github.com/leanprover-community/mathlib4/blob/v4.32.0/Mathlib/GroupTheory/FreeGroup/Reduce.lean"
    relationship: "builds-on"
    note: "Uses the canonical reduced-word encoding and normalization lemmas to enumerate suffix states of finite words."
  - id: "https://github.com/leanprover-community/mathlib4/blob/v4.32.0/Mathlib/GroupTheory/Coset/Basic.lean"
    relationship: "builds-on"
    note: "Uses the left-coset quotient and its exact relation to subgroup membership."
  - id: "https://github.com/leanprover-community/mathlib4/blob/v4.32.0/Mathlib/Logic/Equiv/Fintype.lean"
    relationship: "builds-on"
    note: "Uses `Equiv.extendSubtype` to complete each finite partial generator action to a permutation."
  - id: "https://github.com/Arthur742Ramos/GraphCoveringTheory"
    relationship: "other"
    note: "The preceding covering-graph and Schreier development motivated the finite-state covering formulation, but is not imported by this repository."
  - id: "https://github.com/Arthur742Ramos/HowsonIntersectionTheorem"
    relationship: "other"
    note: "A downstream Howson intersection development using the Hall and Kurosh layers; it is a separate formalization and is not the selected finite-separator result here."

status:
  scope: >-
    The main Hall theorem covers every finite generating type alpha and every
    finitely generated subgroup H of FreeGroup alpha. It produces a subgroup
    K containing H with nonzero natural-number index, a complement, and a
    multiplicative equivalence H * complement ≃* K whose left injection is the
    actual inclusion of H. The same finite-state engine yields an explicit
    finite permutation separator for any element outside H, and its
    basepoint stabilizer yields the LERF witness. The rank result covers binary and
    finite indexed free products of free groups on finite types, and the
    arbitrary-factor binary rank theorem is proved for all finitely generated
    groups by strong induction on the finite labelled graph.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "MarshallHall.marshallHall"
      file: "MarshallHall/Hall.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "LERFChallenge.freeGroup_finite_permutation_separator"
      file: "LERFSolution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "lerf-comparator.json"
    - declaration: "MarshallHall.rank_binaryFreeProduct"
      file: "MarshallHall/Grushko.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "MarshallHall.GeneralGrushko.rank_coprodI_freeGroup"
      file: "MarshallHall/GrushkoGeneral.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - declaration: "MarshallHall.rank_freeProduct_eq_add"
      file: "MarshallHall.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "freeGroup_subgroup_separable"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["GPT-5 Codex"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Pinned Lean/Mathlib builds, kernel checking, closure-safe Challenge compilation, and Comparator/NanoDa replay."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: >-
        The theorem was developed against the pinned Lean and Mathlib APIs and
        checked by the Lean kernel. GPT-5 Codex materially contributed the
        finite suffix-state construction, permutation completion, and proof
        scripts; the human authors selected the mathematical target, supplied
        mathematical supervision, reviewed the formal statements, and retain
        responsibility for verification and communication.
  spend_usd: "subscription-based"
  notes: >-
    The public statements are isolated from the finite-core implementation
    modules. The `lerf-comparator.json` surface selects the explicit finite
    permutation action, while `comparator.json` preserves the earlier
    Hall/Grushko surface.

fidelity:
  divergences: >-
    The existing public Challenge selects both the strengthened
    inclusion-compatible Hall free-factor theorem and the arbitrary-factor
    binary Grushko--Neumann equality. The separate LERF Challenge selects the
    explicit finite permutation separator, while the finite-indexed free-group
    rank calculation and the stabilizer-form LERF corollary remain additional
    proved library results on the main surface. The finite cover in the Hall
    construction is encoded as a finite permutation action on a set of
    left-coset states; the binary arbitrary-factor rank theorem is proved by
    the finite graph reduction in `MarshallHall/GrushkoFull.lean`.

review:
  status: "self-assessed"
  reviewers:
    - "none"
  notes: >-
    The Challenge theorem is a small statement surface with one deliberate
    proof hole excluded from the status counts; the separate LERF Challenge has
    its own statement-only proof hole. The Solutions and implementation
    library contain no proof holes or nonstandard axioms. The finite
    suffix-state construction, permutation completion, basepoint stabilizer,
    finite-index argument, subgroup containment, free-factor retraction, rank
    calculations, and arbitrary-factor graph reduction are checked by Lean's
    kernel; the pinned Comparator replay checks both selected
    Challenge/Solution correspondences independently, including the separate
    finite-permutation Comparator surface.

alignment:
  namespace: ""
  statements:
    - source: "Marshall Hall, Subgroups of Finite Index in Free Groups"
      lean: "freeGroup_finite_permutation_separator"
      module: "MarshallHall.lean"
      status: "proved"
      note: "For a finitely generated subgroup H and g outside H, the library constructs a finite state type, a homomorphism to its permutation group, an H-fixed base state, and a basepoint moved by g."
    - source: "Marshall Hall, Subgroups of Finite Index in Free Groups"
      lean: "freeGroup_subgroup_separable"
      module: "MarshallHall.lean"
      status: "proved"
      note: "The basepoint stabilizer of the explicit finite permutation representation gives a finite-index subgroup containing H but excluding g."
    - source: "Stallings finite-core method"
      lean: "LERFChallenge.freeGroup_finite_permutation_separator"
      module: "LERFSolution.lean"
      status: "proved"
      note: "The standalone Palomar surface selects the actual finite permutation representation and its H-fixed/g-moved base state; it is not merely an existential finite-index statement."
    - source: "Marshall Hall, Subgroups of Finite Index in Free Groups"
      lean: "MarshallHall.marshallHall"
      module: "MarshallHall/Hall.lean"
      status: "proved"
      note: "One of the two new Palomar-selected results: the witness records K, H ≤ K, nonzero index, a complement, and the actual subgroup inclusion under the coproduct equivalence."
    - source: "B. H. Neumann, On the Number of Generators of a Free Product"
      lean: "MarshallHall.rank_binaryFreeProduct"
      module: "MarshallHall/Grushko.lean"
      status: "proved"
      note: "Binary rank additivity is formalized for free groups on finite types; the lower bound is certified through free abelianization."
    - source: "B. H. Neumann, On the Number of Generators of a Free Product"
      lean: "MarshallHall.GeneralGrushko.rank_coprodI_freeGroup"
      module: "MarshallHall/GrushkoGeneral.lean"
      status: "proved"
      note: "The finite indexed free-group case is transported through the canonical indexed free-product equivalence."
    - source: "B. H. Neumann, On the Number of Generators of a Free Product"
      lean: "MarshallHall.rank_freeProduct_eq_add"
      module: "MarshallHall.lean"
      status: "proved"
      note: "The second new Palomar-selected result: the rank of a free product of arbitrary finitely generated groups is the sum of the factor ranks, obtained by a kernel-checked finite labelled-graph reduction including source-unfold and monochromatic-vertex contraction cases."
    - source: "Stallings finite-core method"
      lean: "MarshallHall.freeGroup_subgroup_separable_proved"
      module: "MarshallHall/Separation.lean"
      status: "proved"
      note: "The implementation enumerates suffix states, completes partial label actions, and uses the resulting basepoint stabilizer."
    - source: "Mathlib GroupTheory FreeGroup Reduce"
      lean: "MarshallHall.wordValue_eq_freeGroup_mk"
      module: "MarshallHall/FiniteCore.lean"
      status: "proved"
      note: "The finite-core word evaluator agrees with Mathlib's reduced free-group word representation."

acknowledgements: "Mathlib contributors for the free-group, quotient, finite-type, permutation, and group-action infrastructure; John R. Stallings, Ilya Kapovich, and Alexei Myasnikov for the finite-core and folding perspectives; Marshall Hall, Jr. for the classical theorem; and the Palomar Registry project for the statement/solution Comparator workflow."
